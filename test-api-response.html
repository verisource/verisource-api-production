<!DOCTYPE html>
<html>
<head><title>API Test</title></head>
<body>
<h1>Testing VeriSource API Response</h1>
<input type="file" id="file" accept="image/*">
<button onclick="test()">Test Upload</button>
<pre id="result"></pre>

<script>
async function test() {
  const file = document.getElementById('file').files[0];
  if (!file) return alert('Select a file first');
  
  const formData = new FormData();
  formData.append('file', file);
  
  const res = await fetch('https://api.verisource.io/verify', {
    method: 'POST',
    body: formData
  });
  
  const data = await res.json();
  
  console.log('Full API Response:', data);
  console.log('AI Detection object:', data.ai_detection);
  console.log('Forensic Analysis:', data.ai_detection?.forensic_analysis);
  
  document.getElementById('result').textContent = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
